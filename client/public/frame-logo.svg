<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <!-- FRAME Primary Brand Logo (Symbol + Wordmark) -->
  <defs>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16DCEB" />
      <stop offset="100%" stop-color="#42E5F0" />
    </linearGradient>
  </defs>

  <!-- Viewfinder Symbol -->
  <g transform="translate(0, 0)">
    <!-- Brackets -->
    <path
      d="M 4 12.5 V 6.5 C 4 5.12 5.12 4 6.5 4 H 12.5"
      stroke="#F2F2F2"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 23.5 4 H 29.5 C 30.88 4 32 5.12 32 6.5 V 12.5"
      stroke="url(#logo-cyan)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 32 23.5 V 29.5 C 32 30.88 30.88 32 29.5 32 H 23.5"
      stroke="#F2F2F2"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 12.5 32 H 6.5 C 5.12 32 4 30.88 4 29.5 V 23.5"
      stroke="#F2F2F2"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lens Ring -->
    <circle
      cx="18"
      cy="18"
      r="8"
      stroke="#F2F2F2"
      stroke-width="1.75"
      stroke-opacity="0.85"
    />

    <!-- Aperture Blades -->
    <g stroke="#F2F2F2" stroke-width="1.25" stroke-linecap="round" opacity="0.6">
      <line x1="18" y1="10" x2="21.5" y2="16.5" />
      <line x1="24.9" y1="14" x2="21.5" y2="19.5" />
      <line x1="24.9" y1="22" x2="18" y2="21" />
      <line x1="18" y1="26" x2="14.5" y2="19.5" />
      <line x1="11.1" y1="22" x2="14.5" y2="16.5" />
      <line x1="11.1" y1="14" x2="18" y2="15" />
    </g>

    <!-- Focal Sensor -->
    <circle
      cx="18"
      cy="18"
      r="3"
      fill="url(#logo-cyan)"
    />
  </g>

  <!-- Typography Wordmark: FRAME -->
  <!-- Geometric F -->
  <path d="M 48 9 H 60 M 48 18 H 57 M 48 9 V 27" stroke="#F2F2F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Geometric R -->
  <path d="M 68 9 H 76 C 78.5 9 80 10.5 80 13.5 C 80 16.5 78.5 18 76 18 H 68 M 68 9 V 27 M 75 18 L 81 27" stroke="#F2F2F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Geometric A -->
  <path d="M 94 9 L 88 27 M 94 9 L 100 27 M 90 22 H 98" stroke="#F2F2F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Geometric M -->
  <path d="M 108 27 V 9 L 115 19 L 122 9 V 27" stroke="#F2F2F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Geometric E -->
  <path d="M 141 9 H 130 V 27 H 141 M 130 18 H 138" stroke="#F2F2F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyan Focus Accent Dot -->
  <circle cx="151" cy="25" r="2.2" fill="url(#logo-cyan)" />
</svg>
