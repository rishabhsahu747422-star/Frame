<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- FRAME Official Primary Logo (Symbol + Geometric Wordmark + Tagline) -->
  <defs>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16DCEB" />
      <stop offset="100%" stop-color="#42E5F0" />
    </linearGradient>
  </defs>

  <!-- Left Symbol (Viewfinder Aperture Symbol) -->
  <g transform="translate(2, 2) scale(0.68)">
    <!-- Top-Left Outer Frame -->
    <path
      d="M 21.5 6 H 82 C 88 6 92.7 10.7 92.7 16.5 V 21.5 H 81.5 L 81.5 21 C 81.5 18.5 79.5 16.5 77 16.5 H 24.5 C 20.1 16.5 16.5 20.1 16.5 24.5 V 78.5 C 16.5 82.9 20.1 86.5 24.5 86.5 H 27.2 V 94 H 21.5 C 13.5 94 7 87.5 7 79.5 V 20.5 C 7 12.5 13.5 6 21.5 6 Z"
      fill="url(#logo-cyan)"
    />

    <!-- Inner "F" Aperture Arm & Stem -->
    <path
      d="M 44 32 H 75.5 L 67.5 41 H 47 C 45 41 43.5 42.5 43.5 44.5 V 76 L 34.5 85 V 43.5 C 34.5 37 38.5 32 44 32 Z"
      fill="url(#logo-cyan)"
    />

    <!-- Bottom-Right Outer Frame -->
    <path
      d="M 91.5 37 L 82.5 45 V 77 C 82.5 81.5 79 84.5 75 84.5 H 57.5 L 49.5 94 H 78.5 C 86.5 94 93 87.5 93 79.5 V 39 C 93 38.2 92.3 37.4 91.5 37 Z"
      fill="url(#logo-cyan)"
    />

    <!-- Central Focal Aperture Dot -->
    <circle
      cx="58"
      cy="55.5"
      r="5.2"
      fill="url(#logo-cyan)"
    />
  </g>

  <!-- Wordmark: F R Λ M E in Pure Vector Paths -->
  <g fill="#F2F2F2" transform="translate(86, 12)">
    <!-- F -->
    <path d="M 0 0 H 22 V 4.5 H 4.5 V 12 H 19 V 16.5 H 4.5 V 28 H 0 Z" />

    <!-- R -->
    <path
      d="M 44 0 H 58.5 C 63.5 0 67.5 3 67.5 8.5 C 67.5 12.5 64.5 15.5 60.5 16 L 68 28 H 62.5 L 55.5 16.5 H 48.5 V 28 H 44 Z M 48.5 4.5 V 12 H 58 C 60.5 12 62.5 10.5 62.5 8.2 C 62.5 6 60.5 4.5 58 4.5 Z"
    />

    <!-- A (Geometric Chevron without crossbar) -->
    <path d="M 100.5 0 L 113 28 H 107.5 L 100.5 11 L 93.5 28 H 88 Z" />

    <!-- M -->
    <path
      d="M 134 0 H 138.8 L 147 18 L 155.2 0 H 160 V 28 H 155.5 V 8.5 L 148.2 24.5 H 145.8 L 138.5 8.5 V 28 H 134 Z"
    />

    <!-- E -->
    <path d="M 183 0 H 205 V 4.5 H 187.5 V 12 H 201.5 V 16.5 H 187.5 V 23.5 H 205 V 28 H 183 Z" />
  </g>

  <!-- Tagline: CAPTURE / CREATE / CONNECT -->
  <g transform="translate(86, 56)">
    <text
      x="0"
      y="0"
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="8.5"
      font-weight="600"
      letter-spacing="0.22em"
      fill="#A3A3A3"
    >
      CAPTURE <tspan fill="url(#logo-cyan)" font-weight="700"> / </tspan> CREATE <tspan fill="url(#logo-cyan)" font-weight="700"> / </tspan> CONNECT
    </text>
  </g>
</svg>
