<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- FRAME Brand Icon (Viewfinder + Aperture Iris) -->
  <defs>
    <linearGradient id="frame-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16DCEB" />
      <stop offset="100%" stop-color="#42E5F0" />
    </linearGradient>
  </defs>

  <!-- Viewfinder Frame Brackets -->
  <!-- Top-Left -->
  <path
    d="M 4 12.5 V 6.5 C 4 5.12 5.12 4 6.5 4 H 12.5"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Top-Right (Focus & Shutter Cyan Accent) -->
  <path
    d="M 23.5 4 H 29.5 C 30.88 4 32 5.12 32 6.5 V 12.5"
    stroke="url(#frame-cyan-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Bottom-Right -->
  <path
    d="M 32 23.5 V 29.5 C 32 30.88 30.88 32 29.5 32 H 23.5"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Bottom-Left -->
  <path
    d="M 12.5 32 H 6.5 C 5.12 32 4 30.88 4 29.5 V 23.5"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Outer Lens Ring -->
  <circle
    cx="18"
    cy="18"
    r="8"
    stroke="#F2F2F2"
    stroke-width="1.75"
    stroke-opacity="0.85"
  />

  <!-- Aperture Blades -->
  <g stroke="#F2F2F2" stroke-width="1.25" stroke-linecap="round" opacity="0.6">
    <line x1="18" y1="10" x2="21.5" y2="16.5" />
    <line x1="24.9" y1="14" x2="21.5" y2="19.5" />
    <line x1="24.9" y1="22" x2="18" y2="21" />
    <line x1="18" y1="26" x2="14.5" y2="19.5" />
    <line x1="11.1" y1="22" x2="14.5" y2="16.5" />
    <line x1="11.1" y1="14" x2="18" y2="15" />
  </g>

  <!-- Central Focal Sensor / Aperture Eye -->
  <circle
    cx="18"
    cy="18"
    r="3"
    fill="url(#frame-cyan-grad)"
  />
</svg>
