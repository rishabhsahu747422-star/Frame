<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- FRAME Favicon / App Icon -->
  <defs>
    <linearGradient id="favicon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16DCEB" />
      <stop offset="100%" stop-color="#42E5F0" />
    </linearGradient>
  </defs>

  <!-- Dark Charcoal Squircle Background -->
  <rect width="36" height="36" rx="8" fill="#090909" />
  <rect width="36" height="36" rx="8" stroke="#303030" stroke-width="1" />

  <!-- Viewfinder Frame Brackets -->
  <path
    d="M 6 13 V 8 C 6 6.9 6.9 6 8 6 H 13"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 23 6 H 28 C 29.1 6 30 6.9 30 8 V 13"
    stroke="url(#favicon-cyan)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 30 23 V 28 C 30 29.1 29.1 30 28 30 H 23"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 13 30 H 8 C 6.9 30 6 29.1 6 28 V 23"
    stroke="#F2F2F2"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lens Ring -->
  <circle
    cx="18"
    cy="18"
    r="6.5"
    stroke="#F2F2F2"
    stroke-width="1.6"
    stroke-opacity="0.8"
  />

  <!-- Aperture Eye / Cyan Core -->
  <circle
    cx="18"
    cy="18"
    r="3"
    fill="url(#favicon-cyan)"
  />
</svg>